name: Desktop validation
run-name: ${{ inputs.full_checks && 'Full validation' || 'Fast installer' }} · ${{ inputs.target }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop platform to build
        type: choice
        default: windows
        options:
          - both
          - windows
          - macos
      full_checks:
        description: Run all application tests and JavaScript checks (slower)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'windows' && '["windows-latest"]' || inputs.target == 'macos' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify all application workflows
        if: inputs.full_checks
        run: python -m unittest discover -s tests -v
      - name: Verify application JavaScript
        if: inputs.full_checks
        run: |
          node --check app/app.js
          node --check app/backend.js
          node --check app/auth.js
          node --check app/payments.js
          node --check app/parties.js
          node --check app/invoices.js
          node --check app/pharmacy.js
          node --check app/workflows.js
          node --check app/icons.js
          node --check desktop/main.cjs
      - name: Verify packaging cleanup
        if: ${{ !inputs.full_checks }}
        run: python -m unittest discover -s tests -p test_packaging.py
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: desktop-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Reuse packaged backend
        id: backend-cache
        uses: actions/cache@v4
        with:
          path: backend-dist/ledgerly-backend
          key: backend-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/**/*.py', 'app/**', 'scripts/build_backend.py', 'scripts/requirements-build.txt') }}
      - name: Install backend packager
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Package backend
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: python scripts/build_backend.py
      - name: Smoke test packaged backend
        run: python scripts/smoke_backend.py
      - name: Build unsigned Windows development installer
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Build unsigned macOS development image
        if: runner.os == 'macOS'
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-development-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
