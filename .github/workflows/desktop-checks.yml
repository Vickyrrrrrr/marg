name: Desktop validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'server.py'
      - 'test_server.py'
      - 'package*.json'
      - '.github/workflows/desktop-checks.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database workflows
        run: python -m unittest test_server.py
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Package backend
        run: python desktop/build_backend.py
      - name: Smoke test packaged backend
        run: python desktop/smoke_backend.py
      - name: Build unsigned Windows development installer
        if: runner.os == 'Windows'
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build unsigned macOS development image
        if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerly-development-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
