name: Desktop validation
run-name: ${{ inputs.mode }} · ${{ inputs.mode == 'release-candidate' && 'both' || inputs.target }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fast installer, checks only, or fully checked candidate for both platforms
        type: choice
        default: fast
        options:
          - fast
          - validate
          - release-candidate
      target:
        description: Platform for fast/validate modes (release-candidate always checks both)
        type: choice
        default: windows
        options:
          - windows
          - macos
          - both
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.mode == 'release-candidate' && 'both' || inputs.target }}
  cancel-in-progress: ${{ inputs.mode != 'release-candidate' }}
jobs:
  source:
    name: Source and dependency consistency
    if: inputs.mode != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check script syntax, dependency lock and test-group coverage
        run: python scripts/ci_checks.py --group source
      - name: Upload source report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-checks-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/*.json
          retention-days: 7
          if-no-files-found: error

  validate:
    name: Application checks (${{ matrix.os }})
    if: inputs.mode != 'fast'
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mode == 'release-candidate' && '["windows-latest","macos-latest"]' || inputs.target == 'windows' && '["windows-latest"]' || inputs.target == 'macos' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Billing, inventory and accounting
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group billing-stock
      - name: Pharmacy and prescription controls
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group pharmacy
      - name: Party ledgers and invoices
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group parties-invoices
      - name: Payments and refunds
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group payments
      - name: Financial-year closing
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group financial-year
      - name: Authentication and permissions
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group security
      - name: Backup and recovery
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group recovery
      - name: Held bills, recalls and purchasing
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group counter-recalls
      - name: Verify atomic counter checkout
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group counter-checkout
      - name: Packaging process cleanup
        if: ${{ !cancelled() }}
        run: python scripts/ci_checks.py --group packaging
      - name: Upload grouped test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ runner.os }}-${{ runner.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/*.json
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Installer (${{ matrix.os }})
    needs: [source, validate]
    if: ${{ !cancelled() && inputs.mode != 'validate' && (inputs.mode == 'fast' || (needs.source.result == 'success' && needs.validate.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mode == 'release-candidate' && '["windows-latest","macos-latest"]' || inputs.target == 'windows' && '["windows-latest"]' || inputs.target == 'macos' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BUILD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify packaging cleanup
        if: inputs.mode == 'fast'
        run: python scripts/ci_checks.py --group packaging
      - name: Restore installer tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: desktop-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Reuse packaged backend
        id: backend-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend-dist/ledgerly-backend
          key: backend-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/**/*.py', 'app/**', 'scripts/build_backend.py', 'scripts/requirements-build.txt') }}
      - name: Install backend packager
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Package backend
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: python scripts/build_backend.py
      - name: Smoke test packaged backend (including cache hits)
        timeout-minutes: 3
        run: python scripts/smoke_backend.py
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Build unsigned macOS image
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Record installer checksums and build identity
        run: python scripts/package_manifest.py
      - name: Upload installers and verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgerly-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/build-info.json
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: ${{ inputs.mode == 'release-candidate' && 30 || 7 }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports/*.json
            dist/builder-debug.yml
          retention-days: 7
          if-no-files-found: ignore
